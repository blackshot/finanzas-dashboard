# Compila la imagen Docker y la publica en GitHub Container Registry (ghcr.io)
# cada vez que llegan cambios a la rama main.
name: Publicar imagen Docker

on:
  push:
    branches: [main]
  workflow_dispatch: # permite lanzarlo a mano desde la pestaña Actions

# evita dos publicaciones simultáneas; la más nueva reemplaza a la anterior
concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }} # blackshot/finanzas-dashboard

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # publicar en ghcr.io con el GITHUB_TOKEN
    steps:
      - name: Descargar código
        uses: actions/checkout@v7

      # emulación para compilar también la versión ARM (Mac M1+, Raspberry Pi)
      - name: Preparar QEMU
        uses: docker/setup-qemu-action@v4

      - name: Preparar Buildx
        uses: docker/setup-buildx-action@v4

      - name: Iniciar sesión en ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # etiquetas: latest, sha-<commit> y la fecha (ej. 2026-10-23)
      - name: Calcular etiquetas
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=raw,value={{date 'YYYY-MM-DD'}}
          labels: |
            org.opencontainers.image.title=Dashboard de finanzas
            org.opencontainers.image.description=Dashboard para analizar reportes CSV de Mercado Pago. Los datos se procesan en el navegador.

      - name: Compilar y publicar
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # reutiliza capas entre ejecuciones para compilar más rápido
          cache-from: type=gha
          cache-to: type=gha,mode=max
